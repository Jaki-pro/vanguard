services:
  postgres:
    image: postgres:15-alpine
    container_name: vanguard_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vanguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - vanguard_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d vanguard_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    container_name: vanguard_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: vanguard-org
      DOCKER_INFLUXDB_INIT_BUCKET: vanguard_telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: vanguard-influx-token-2024
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - vanguard_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vanguard_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - vanguard_network
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanguard_app
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      # PostgreSQL
      DATABASE_URL: postgresql://postgres:password@postgres:5432/vanguard_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      # Auth
      BETTER_AUTH_SECRET: vanguard-auth-secret-change-me-in-production-min-32
      BETTER_AUTH_URL: http://localhost:3000
      # MQTT
      BROKER_URL: mqtt://mosquitto:1883
      NEXT_PUBLIC_MQTT_BROKER_URL: ws://localhost:9001/mqtt
      # InfluxDB
      INFLUX_URL: http://influxdb:8086
      INFLUX_HOST: influxdb
      INFLUX_ORG: vanguard-org
      INFLUX_BUCKET: vanguard_telemetry
      INFLUX_TOKEN: vanguard-influx-token-2024
      # Frontend
      NEXT_PUBLIC_API_URL: http://localhost:3001/
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - vanguard_network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

networks:
  vanguard_network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_logs:
